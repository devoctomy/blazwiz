# Publishes a release when the maintainer pushes a tag such as v1.2.0: checks the tag matches the version, runs every
# check, then pushes every Devoctomy.Blazwiz package and the template package to nuget.org, all at that version. See
# docs/releasing.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    # Holds the NUGET_API_KEY secret; add required reviewers to it for a manual approval before publishing.
    environment: nuget
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      MSBUILDDISABLENODEREUSE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check the tag matches the version
        shell: pwsh
        run: ./eng/check-versions.ps1 -Tag "${{ github.ref_name }}"

      - name: Install the Playwright browser
        shell: pwsh
        run: |
          dotnet build template/MyApp.Portal.UITests --nologo -v q
          ./template/MyApp.Portal.UITests/bin/Debug/net10.0/playwright.ps1 install chromium

      - name: Test the repository, packages and template
        shell: pwsh
        run: ./templatepack/test-template.ps1

      - name: Pack
        shell: pwsh
        run: |
          dotnet pack blazwiz.slnx -c Release -o artifacts/packages --nologo
          dotnet pack templatepack/Devoctomy.Blazwiz.Templates.csproj -c Release -o artifacts/packages --nologo

      - name: Push to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
