# Publishes every Devoctomy.Blazwiz package and the template package to nuget.org, all at one version, and on main
# creates the GitHub release with its tag. It does not run the tests: it only publishes a commit the CI workflow (ci.yml)
# has already passed.
#
# Run workflow works out what to publish from the branch:
# - main: the version in Directory.Build.props (set with eng/bump-version.ps1): a release, tagged v<version>, with a
#   GitHub release.
# - any other branch: a beta, <version>-beta.<run number>, on nuget.org only. No tag or GitHub release: the branch is
#   deleted when it is merged, and a tag or release pointing at its commits would be left behind. If the version in
#   Directory.Build.props is already released, the beta is of the next minor version, so it sorts above that release.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # CI must have passed for this exact commit; waits for a run still in progress.
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check CI passed for ${{ github.sha }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = '${{ github.sha }}'
          $deadline = (Get-Date).AddMinutes(110)
          while ($true) {
            $runs = (gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=50" | ConvertFrom-Json).workflow_runs
            # A run counts only if its jobs ran and passed: CI skips them for a push that only creates a branch, and
            # such a run can still end as a success.
            $passed = $runs | Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' } | Where-Object {
              $jobs = @((gh api "repos/${{ github.repository }}/actions/runs/$($_.id)/jobs" | ConvertFrom-Json).jobs)
              $jobs.Count -gt 0 -and -not ($jobs | Where-Object { $_.conclusion -ne 'success' })
            }
            if ($passed) {
              Write-Host "CI passed for $sha."
              break
            }

            if (-not ($runs | Where-Object { $_.status -ne 'completed' })) {
              throw "CI has not passed for $sha (runs: $(@($runs).Count)). Push the commit and let CI pass, then publish again."
            }

            if ((Get-Date) -gt $deadline) {
              throw "CI for $sha did not finish in time."
            }

            Write-Host 'CI is still running for this commit; waiting.'
            Start-Sleep -Seconds 60
          }

  publish:
    needs: ci-passed
    runs-on: windows-latest
    timeout-minutes: 30
    # nuget.org's Trusted Publishing policy can be limited to this environment. Holds the NUGET_USER secret; add
    # required reviewers to it for a manual approval before publishing.
    environment: nuget
    permissions:
      contents: read
      # An OIDC token from GitHub, exchanged for a short-lived nuget.org API key (Trusted Publishing).
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Work out the version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, never into the script: a branch name can hold quotes and $( ).
          REF_NAME: ${{ github.ref_name }}
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $prefix = $props.Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1
          if ($prefix -notmatch '^\d+\.\d+\.\d+$') { throw "VersionPrefix in Directory.Build.props must be MAJOR.MINOR.PATCH, not '$prefix'." }

          # Released: a GitHub release exists for it, or it is on nuget.org.
          gh release view "v$prefix" --repo '${{ github.repository }}' *> $null
          $hasRelease = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          $published = (Invoke-RestMethod 'https://api.nuget.org/v3-flatcontainer/devoctomy.blazwiz.core/index.json').versions -contains $prefix

          if ($env:REF_NAME -eq 'main') {
            if ($hasRelease) { throw "$prefix is already released. Set the next version with ./eng/bump-version.ps1, merge it, then release." }
            if (-not (Select-String -Path CHANGELOG.md -Pattern "^## $([regex]::Escape($prefix))\s*$" -Quiet)) {
              throw "CHANGELOG.md has no section for $prefix. Set the version with ./eng/bump-version.ps1, merge it, then release."
            }
            if ($published) { Write-Host "$prefix is already on nuget.org: pushing skips it, and the GitHub release is created." }
            $suffix = ''
            $version = $prefix
            $prerelease = 'false'
          }
          else {
            if ($hasRelease -or $published) {
              $v = [version]$prefix
              $prefix = "$($v.Major).$($v.Minor + 1).0"
            }
            $suffix = "beta.${{ github.run_number }}"
            $version = "$prefix-$suffix"
            $prerelease = 'true'
          }

          Write-Host "Publishing $version"
          "prefix=$prefix" >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Pack
        shell: pwsh
        run: |
          $versionArgs = @('-p:VersionPrefix=${{ steps.version.outputs.prefix }}', '-p:VersionSuffix=${{ steps.version.outputs.suffix }}')
          # From 1.0, packing fails on a binary breaking change against the latest release.
          $baseline = ./eng/get-validation-baseline.ps1
          # @(...) around the if: PowerShell unwraps a one-element array output from an if, and splatting a string
          # passes it to a native command one character at a time.
          $validation = @(if ($baseline) { "-p:PackageValidationBaselineVersion=$baseline" })
          dotnet pack blazwiz.slnx -c Release -o artifacts/packages --nologo @versionArgs @validation
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The template's Directory.Packages.props gets this version when packed, so new apps use these packages.
          dotnet pack templatepack/Devoctomy.Blazwiz.Templates.csproj -c Release -o artifacts/packages --nologo @versionArgs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Trusted Publishing: no stored API key. The key is valid for an hour, so it is asked for just before pushing.
      - name: NuGet login (OIDC to a temporary API key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # The nuget.org profile name (not the email address).
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        # dotnet nuget push does not expand a wildcard in a path with forward slashes on Windows ("File does not
        # exist"), so the packages are listed here and pushed by full path. Each push takes its .snupkg with it.
        run: |
          $packages = @(Get-ChildItem -Path artifacts/packages -Filter *.nupkg)
          if ($packages.Count -eq 0) { throw 'No packages in artifacts/packages.' }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Keep the packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: artifacts/packages

      # A beta has no GitHub release, so the run's summary says what was published and how to install it.
      - name: Summary
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $kind = if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { "Beta of ``$env:REF_NAME`` at ${{ github.sha }}" } else { 'Release' }
          @(
            "## Published $version to nuget.org",
            '',
            "$kind.",
            '',
            '```',
            "dotnet new install Devoctomy.Blazwiz.Templates@$version",
            '```'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

  # The tag v<version> on this commit, and the GitHub release with the changelog section and the packages. Releases
  # from main only; betas are on nuget.org only. A separate job, so only it can write to the repository, and only after
  # the packages are published.
  github-release:
    needs: publish
    if: needs.publish.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-${{ needs.publish.outputs.version }}
          path: artifacts/packages

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ needs.publish.outputs.version }}'

          # The version's changelog section is the release notes.
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($version))[^\r\n]*\r?\n(.*?)(?=^## |\z)").Groups[1].Value.Trim()
          Set-Content -Path release-notes.md -Value $section -Encoding utf8

          $assets = @(Get-ChildItem -Path artifacts/packages -File | ForEach-Object { $_.FullName })
          gh release create "v$version" @assets --repo '${{ github.repository }}' --target '${{ github.sha }}' --title $version --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { exit 1 }
