# Deploys a NEW environment of the template app (template/, as "myapp") to AWS: the blazwiz base stack and the app's own
# stack (template/cloudformation/app.yaml), the portal, and optionally a test user. Built from this commit's source:
# the base stack and its scripts come from src/Devoctomy.Blazwiz.Aws, and the portal builds against the packages'
# source (template/Directory.Build.targets), so this tests the framework as it stands, before it is released. Run by
# hand (Actions > Deploy > Run workflow), on a commit the CI workflow has passed.
#
# Refused if the environment already exists: use the Upgrade workflow to update one.
#
# Each environment is a GitHub environment of the same name (Settings > Environments), holding:
# - variable AWS_DEPLOY_ROLE_ARN: the IAM role GitHub assumes through OIDC (no AWS keys are kept in GitHub). It needs
#   the minimum deploy policy in template/cloudformation/deploy-policy.json. See docs/deploying.md.
# - variable AWS_REGION: the region the environment is in, e.g. eu-west-2.
# - secret TEST_USER_PASSWORD: only if a test user is created (min 12 characters, upper, lower and a number).
# - variables CUSTOM_DOMAIN_NAME and CERTIFICATE_ARN: optional, both or neither. The portal's own address and an ACM
#   certificate for it in us-east-1. Point the address's DNS at the CloudFront distribution.
# Add required reviewers to the GitHub environment to approve each run before it starts.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment name (lowercase letters and numbers), e.g. test. The stacks are myapp-<environment>.'
        required: true
        default: test
      test_user_email:
        description: 'Email of a test user to create (optional; its password is the environment secret TEST_USER_PASSWORD).'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: aws-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  ci-passed:
    uses: ./.github/workflows/ci-passed.yml

  deploy:
    needs: ci-passed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      # An OIDC token from GitHub, exchanged for short-lived AWS credentials.
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Fresh MSBuild processes for every build (static web assets compression).
      MSBUILDDISABLENODEREUSE: 1
      # Through the environment, never into the script: an input can hold quotes and $( ).
      ENVIRONMENT_NAME: ${{ inputs.environment }}
      # Optional: the portal's own address and its ACM certificate (in us-east-1). Passed on every run, as the stack
      # drops the address when they are not.
      CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
      CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_DEPLOY_REGION: ${{ vars.AWS_REGION }}
      TEST_USER_EMAIL: ${{ inputs.test_user_email }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - name: Check the inputs
        shell: pwsh
        run: |
          if ($env:ENVIRONMENT_NAME -notmatch '^[a-z][a-z0-9]{0,9}$') { throw "The environment name must be lowercase letters and numbers, starting with a letter (max 10): '$env:ENVIRONMENT_NAME'." }
          if (-not $env:AWS_DEPLOY_ROLE_ARN) { throw "The GitHub environment '$env:ENVIRONMENT_NAME' has no AWS_DEPLOY_ROLE_ARN variable." }
          if (-not $env:AWS_DEPLOY_REGION) { throw "The GitHub environment '$env:ENVIRONMENT_NAME' has no AWS_REGION variable." }
          if ([bool]$env:CUSTOM_DOMAIN_NAME -ne [bool]$env:CERTIFICATE_ARN) { throw "The GitHub environment '$env:ENVIRONMENT_NAME' must have both CUSTOM_DOMAIN_NAME and CERTIFICATE_ARN, or neither." }
          if ($env:TEST_USER_EMAIL -and -not $env:TEST_USER_PASSWORD) { throw "A test user was asked for, but the GitHub environment '$env:ENVIRONMENT_NAME' has no TEST_USER_PASSWORD secret." }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # What GitHub's OIDC token says, so a refused sign-in can be matched against the role's trust policy. Prints
      # the token's claims only, never the token, which is short-lived and only accepted with this audience.
      - name: Show the OIDC token's claims
        shell: pwsh
        run: |
          $response = Invoke-RestMethod -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" -Headers @{ Authorization = "bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
          $payload = $response.value.Split('.')[1].Replace('-', '+').Replace('_', '/')
          $payload += '=' * ((4 - $payload.Length % 4) % 4)
          $claims = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload)) | ConvertFrom-Json
          Write-Host "sub:         $($claims.sub)"
          Write-Host "aud:         $($claims.aud)"
          Write-Host "iss:         $($claims.iss)"
          Write-Host "repository:  $($claims.repository)"
          Write-Host "environment: $($claims.environment)"
          Write-Host "ref:         $($claims.ref)"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check the environment does not exist yet
        shell: pwsh
        run: |
          $stack = "myapp-$env:ENVIRONMENT_NAME"
          aws cloudformation describe-stacks --stack-name $stack --region $env:AWS_DEPLOY_REGION *> $null
          if ($LASTEXITCODE -eq 0) { throw "Stack $stack already exists. Use the Upgrade workflow to update it." }
          Write-Host "Stack $stack does not exist yet."
          # describe-stacks failing is the expected outcome here; GitHub's pwsh step would otherwise exit with its code.
          exit 0

      # Parameters written out, not splatted from a hashtable: the app's deploy.ps1 passes them on to the base stack's
      # with @args, which turns a hashtable's switches (Force = $true) into a stray "True".
      - name: Deploy
        shell: pwsh
        run: |
          if ($env:TEST_USER_EMAIL) {
            $password = ConvertTo-SecureString $env:TEST_USER_PASSWORD -AsPlainText -Force
            ./template/cloudformation/deploy.ps1 -Region $env:AWS_DEPLOY_REGION -Environment $env:ENVIRONMENT_NAME -CustomDomainName $env:CUSTOM_DOMAIN_NAME -CertificateArn $env:CERTIFICATE_ARN -TestUserEmail $env:TEST_USER_EMAIL -TestUserPassword $password -Force
          }
          else {
            ./template/cloudformation/deploy.ps1 -Region $env:AWS_DEPLOY_REGION -Environment $env:ENVIRONMENT_NAME -CustomDomainName $env:CUSTOM_DOMAIN_NAME -CertificateArn $env:CERTIFICATE_ARN -SkipTestUser -Force
          }
