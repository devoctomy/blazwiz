# Builds and tests the packages and the template on every push, to any branch. The release workflow only publishes a
# commit this has passed.
#
# Pushes only, not pull requests as well: a pull request from a branch of this repository would run everything a
# second time, and the push run's checks already show on the pull request (they are on the same commit). Pull requests
# from forks are not built.
#
# - test: build, then each group of tests with dotnet test (unit, integration, UI). The unit tests' coverage is sent to
#   Codacy.
# - template: packs the packages and the template, then creates apps with every template option and builds and tests
#   them against the packed packages (templatepack/test-template.ps1, which is not plain dotnet test).
#
# Neither runs when a push only creates a branch, with no commits of its own (as when a tool publishes a branch as soon as
# it is made): that commit is already on the branch it was made from and was tested there. Running again would be
# wasted, and its status would show on that branch too, as GitHub shows a run on its commit, not its branch.
#
# Both run on Linux: nothing is Windows-specific, and Linux runners are faster and cheaper. PowerShell is installed on
# them, for the scripts. The Ubuntu version is fixed, not ubuntu-latest: the Playwright version in use must support it
# (1.55 supports 24.04, not 26.04), and a new runner image should not change what the tests run on unannounced.
name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    # Not for a push that only creates a branch (see above).
    if: ${{ !github.event.created || github.event.commits[0] != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore blazwiz.slnx

      - name: Build
        run: dotnet build blazwiz.slnx --no-restore

      # Coverlet (coverlet.collector) writes a Cobertura report, coverage.cobertura.xml, for each test project.
      - name: Unit tests
        run: dotnet test blazwiz.slnx --no-build --filter "FullyQualifiedName~UnitTests" --logger trx --results-directory TestResults/unit --collect:"XPlat Code Coverage"

      # Codacy's coverage reporter, at a fixed version: get.sh is fetched from that release's commit, and checks the
      # reporter it downloads against its checksum. The CODACY_API_TOKEN repository secret is a Codacy account API token,
      # so it goes with the repository it is for (provider, organization, name). Each report is sent once: the trx
      # logger also copies every report into its run's In folder, and those copies are left out.
      - name: Upload coverage to Codacy
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_ORGANIZATION_PROVIDER: gh
          CODACY_USERNAME: devoctomy
          CODACY_PROJECT_NAME: blazwiz
          CODACY_REPORTER_VERSION: 14.1.3
        run: |
          reports=()
          while IFS= read -r report; do reports+=(-r "$report"); done < <(find TestResults/unit -name coverage.cobertura.xml -not -path '*/In/*')
          bash <(curl -Ls https://raw.githubusercontent.com/codacy/codacy-coverage-reporter/54617baa57421746d0afa3df32127d3dd40f3786/get.sh) report "${reports[@]}"

      - name: Integration tests
        run: dotnet test blazwiz.slnx --no-build --filter "FullyQualifiedName~IntTests" --logger trx --results-directory TestResults/integration

      # --with-deps also installs the libraries Chromium needs on Linux.
      - name: Install the Playwright browser
        shell: pwsh
        run: ./template/MyApp.Portal.UITests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # The UI tests build and start the portal themselves (Release); its output is in TestResults/portal.log.
      - name: UI tests
        run: dotnet test blazwiz.slnx --no-build --filter "FullyQualifiedName~UITests" --logger trx --results-directory TestResults/ui

      - name: Upload test results
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            TestResults/**
            **/bin/Debug/net10.0/TestResults/**
          if-no-files-found: ignore

  template:
    # Not for a push that only creates a branch (see above).
    if: ${{ !github.event.created || github.event.commits[0] != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install the Playwright browser
        shell: pwsh
        run: |
          dotnet build template/MyApp.Portal.UITests --nologo -v q
          ./template/MyApp.Portal.UITests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # The repository's own tests run in the test job.
      - name: Pack, then create, build and test apps from the template
        shell: pwsh
        run: ./templatepack/test-template.ps1 -SkipRepositoryTests -KeepOutput -WorkRoot "${{ runner.temp }}/template-test"

      - name: Upload the generated apps' test results
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-test-results
          path: ${{ runner.temp }}/template-test/apps/*/*.UITests/bin/Debug/net10.0/TestResults/**
          if-no-files-found: ignore
