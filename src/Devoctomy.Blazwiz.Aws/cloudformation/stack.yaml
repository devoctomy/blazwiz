AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  blazwiz base stack - static Blazor WebAssembly PWA hosted on private S3 behind CloudFront, with a Cognito
  user pool for sign-in and an identity pool that gives signed-in users temporary AWS credentials,
  scoped to their own prefix in a private data bucket and their own '<sub>/keys/*' secrets.

Parameters:
  AppName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9]{1,20}$'
    ConstraintDescription: Lowercase letters and numbers, starting with a letter (max 21 characters). No hyphens, as Cognito identity pool names do not allow them.
    Description: Short lowercase application name, used to name resources.

  Environment:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z][a-z0-9]{0,9}$'
    ConstraintDescription: Lowercase letters and numbers, starting with a letter (max 10 characters).
    Description: Environment name, e.g. dev, test, prod. Lets several copies live in one account.

  CustomDomainName:
    Type: String
    Default: ''
    Description: Optional custom domain for the portal, e.g. app.example.com. Leave blank to use the CloudFront domain.

  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN for the custom domain. Must be in us-east-1. Required when CustomDomainName is set.

  LocalDevOrigins:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      Origins allowed to call the data bucket (CORS) in addition to the portal itself, for running the portal locally
      against this environment, e.g. https://localhost:7090,http://localhost:5090. Leave empty for production
      (deploy.ps1 passes the local origins for every environment but prod).

  UserPoolDeletionProtection:
    Type: String
    Default: auto
    AllowedValues: [auto, ACTIVE, INACTIVE]
    Description: >-
      Whether Cognito refuses to delete the user pool, and every user with it, even when the stack is deleted. auto
      turns it on when Environment is prod. remove.ps1 turns it off before deleting the stack.

  AuditLogging:
    Type: String
    Default: auto
    AllowedValues: [auto, 'true', 'false']
    Description: >-
      Whether a CloudTrail trail records every read, write and delete of an object in the data bucket, in an audit log
      bucket of its own (kept a year), so after an incident there is a record of which credentials did what. auto turns
      it on when Environment is prod. Data events are charged for by CloudTrail.

  Events:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: >-
      Whether to create the user events API (AWS AppSync Events), which lets a user's open devices tell each other
      something changed, e.g. "sign out everywhere". Charged per use: connection minutes and event operations. Off
      unless asked for, so no app gets a resource it does not use: apps created with user events pass enabled.

Conditions:
  UseCustomDomain: !And
    - !Not [!Equals [!Ref CustomDomainName, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]
  HasLocalDevOrigins: !Not [!Equals [!Join [',', !Ref LocalDevOrigins], '']]
  IsProd: !Equals [!Ref Environment, prod]
  ProtectUserPool: !Or
    - !Equals [!Ref UserPoolDeletionProtection, ACTIVE]
    - !And [!Equals [!Ref UserPoolDeletionProtection, auto], !Condition IsProd]
  LogDataAccess: !Or
    - !Equals [!Ref AuditLogging, 'true']
    - !And [!Equals [!Ref AuditLogging, auto], !Condition IsProd]
  EventsEnabled: !Equals [!Ref Events, enabled]

Resources:

  # ---------------------------------------------------------------------------
  # Portal hosting: private S3 bucket, served only through CloudFront (OAC)
  # ---------------------------------------------------------------------------

  PortalBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AppName}-${Environment}-portal-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: app
          Value: !Ref AppName
        - Key: environment
          Value: !Ref Environment

  PortalOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AppName}-${Environment}-portal-oac'
        Description: !Sub 'CloudFront access to the ${AppName} ${Environment} portal bucket'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  PortalDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${AppName} ${Environment} portal'
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If [UseCustomDomain, [!Ref CustomDomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - UseCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: PortalBucketOrigin
            DomainName: !GetAtt PortalBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt PortalOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: PortalBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed "CachingOptimized" - honours the Cache-Control headers set by deploy.ps1
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed "SecurityHeadersPolicy" - HSTS, X-Content-Type-Options, X-Frame-Options etc.
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        # Client side routing: S3 returns 403 (not 404) for missing keys when accessed via OAC,
        # so send both to index.html and let the Blazor router handle the URL.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
      Tags:
        - Key: app
          Value: !Ref AppName
        - Key: environment
          Value: !Ref Environment

  PortalBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PortalBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${PortalBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${PortalDistribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt PortalBucket.Arn
              - !Sub '${PortalBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ---------------------------------------------------------------------------
  # Per-user data: private bucket, each identity can only touch <identity-id>/*
  # ---------------------------------------------------------------------------

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AppName}-${Environment}-data-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Users (and anything holding their credentials for an hour) can only delete and overwrite their own objects, so
      # every version is kept for a while: a delete leaves a marker and an overwrite keeps the old version, and only an
      # operator can remove them. The role is not given s3:DeleteObjectVersion or s3:PutBucketVersioning.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT, DELETE, HEAD]
            AllowedOrigins: !Split
              - ','
              - !Join
                - ','
                - - !Sub 'https://${PortalDistribution.DomainName}'
                  - !If [UseCustomDomain, !Sub 'https://${CustomDomainName}', !Ref AWS::NoValue]
                  - !If [HasLocalDevOrigins, !Join [',', !Ref LocalDevOrigins], !Ref AWS::NoValue]
            AllowedHeaders: ['*']
            # ETag drives sync; x-amz-meta-modified-at is the edit time compared when both sides changed.
            ExposedHeaders: [ETag, x-amz-meta-modified-at]
            MaxAge: 3000
      Tags:
        - Key: app
          Value: !Ref AppName
        - Key: environment
          Value: !Ref Environment

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub '${DataBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ---------------------------------------------------------------------------
  # Cognito: user pool (sign-in) + identity pool (temporary AWS credentials)
  # ---------------------------------------------------------------------------

  # Replacing the user pool deletes every user (passwords cannot be exported) and changes its id, so
  # stack-policy.json blocks replacement and UpdateReplacePolicy keeps the old pool if it ever happens.
  # UsernameAttributes, AliasAttributes, UsernameConfiguration and existing Schema attributes cannot be
  # changed in place - decide them before going live.
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AppName}-${Environment}-users'
      # Cognito itself refuses to delete the pool while this is ACTIVE (see the UserPoolDeletionProtection parameter).
      DeletionProtection: !If [ProtectUserPool, ACTIVE, INACTIVE]
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      # The email is the sign-in name, so a new one only takes over once the user has proved they can read it.
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      # Invite only - users are created by an administrator (see deploy.ps1), no self sign-up.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      UserPoolTags:
        app: !Ref AppName
        environment: !Ref Environment

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AppName}-${Environment}-portal'
      UserPoolId: !Ref UserPool
      # Public client (runs in the browser) so it must not have a secret.
      GenerateSecret: false
      # SRP only from the browser: the password never leaves it. The admin flow needs AWS credentials with
      # cognito-idp:AdminInitiateAuth, and is used by test-auth.ps1 to verify sign-in from the command line.
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      # What the portal may read (the ID token's claims) and change with the access token. Nothing writes attributes,
      # and the email can only be changed by an administrator.
      ReadAttributes: [email, email_verified, name]
      WriteAttributes: [name]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      # The portal only keeps the refresh token in memory, so it renews the session while a tab stays open. This caps
      # how long that can go on, and how long a stolen one is any use.
      RefreshTokenValidity: 12
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: hours

  # Identity ids are per identity pool and name each user's prefix in the data bucket, so replacing
  # the pool orphans everyone's data. Protected like the user pool.
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      IdentityPoolName: !Sub '${AppName}_${Environment}_identities'
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClient
          ProviderName: !GetAtt UserPool.ProviderName
          ServerSideTokenCheck: true

  # Puts the user pool sub (the user's immutable id) on each session as the userSub principal tag, so
  # policies can use ${aws:PrincipalTag/userSub}. Needed for Secrets Manager: secret names cannot hold
  # the ':' that identity ids contain.
  IdentityPoolPrincipalTag:
    Type: AWS::Cognito::IdentityPoolPrincipalTag
    Properties:
      IdentityPoolId: !Ref IdentityPool
      IdentityProviderName: !GetAtt UserPool.ProviderName
      UseDefaults: false
      PrincipalTags:
        userSub: sub

  AuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Assumed by signed-in ${AppName} ${Environment} users via the Cognito identity pool'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action:
              - sts:AssumeRoleWithWebIdentity
              # Required for the identity pool to pass the userSub principal tag.
              - sts:TagSession
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: per-user-data
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListOwnPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - '${cognito-identity.amazonaws.com:sub}'
                      - '${cognito-identity.amazonaws.com:sub}/*'
              - Sid: ReadWriteOwnObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${DataBucket.Arn}/${!cognito-identity.amazonaws.com:sub}/*'
        - PolicyName: per-user-keys
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Only secrets under <user pool sub>/keys/: each profile's keys, and the index of them.
              # Secrets Manager appends a random 6 character suffix to every secret ARN, hence '-??????'.
              # TagResource: the portal tags each secret with the app's name as it creates it, so remove.ps1 can find
              # and delete the users' secrets with the environment.
              - Sid: ManageOwnKeysSecrets
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:RestoreSecret
                  - secretsmanager:TagResource
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${!aws:PrincipalTag/userSub}/keys/*-??????'
              # A deleted keys secret can be restored by an operator for at least 7 days (the portal asks for 7). A
              # hijacked session, or a bug, cannot make it gone at once.
              - Sid: NoForcedSecretDeletion
                Effect: Deny
                Action: secretsmanager:DeleteSecret
                Resource: '*'
                Condition:
                  Bool:
                    secretsmanager:ForceDeleteWithoutRecovery: 'true'
      Tags:
        - Key: app
          Value: !Ref AppName
        - Key: environment
          Value: !Ref Environment

  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt AuthenticatedRole.Arn

  # ---------------------------------------------------------------------------
  # Audit log: every read, write and delete of an object in the data bucket (see the AuditLogging parameter)
  # ---------------------------------------------------------------------------

  AuditLogBucket:
    Type: AWS::S3::Bucket
    Condition: LogDataAccess
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AppName}-${Environment}-audit-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldLogs
            Status: Enabled
            ExpirationInDays: 365
      Tags:
        - Key: app
          Value: !Ref AppName
        - Key: environment
          Value: !Ref Environment

  AuditLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: LogDataAccess
    Properties:
      Bucket: !Ref AuditLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditLogBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AppName}-${Environment}-data-access'
          - Sid: AllowCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AuditLogBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AppName}-${Environment}-data-access'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AuditLogBucket.Arn
              - !Sub '${AuditLogBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  DataAccessTrail:
    Type: AWS::CloudTrail::Trail
    Condition: LogDataAccess
    DependsOn: AuditLogBucketPolicy
    Properties:
      TrailName: !Sub '${AppName}-${Environment}-data-access'
      S3BucketName: !Ref AuditLogBucket
      IsLogging: true
      IsMultiRegionTrail: false
      IncludeGlobalServiceEvents: false
      EnableLogFileValidation: true
      EventSelectors:
        - ReadWriteType: All
          # Management events (Cognito, Secrets Manager, CloudFormation and so on) are in the account's own trail.
          IncludeManagementEvents: false
          DataResources:
            - Type: AWS::S3::Object
              Values:
                - !Sub '${DataBucket.Arn}/'
      Tags:
        - Key: app
          Value: !Ref AppName
        - Key: environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # User events: an AppSync Events API through which a user's open devices tell each other something changed (e.g.
  # sign out everywhere). Pub/sub only: nothing is stored, and events carry no secrets. Connecting, publishing and
  # subscribing all need the user pool's tokens; the identity pool's AWS credentials cannot reach it (no IAM auth).
  # ---------------------------------------------------------------------------

  EventsApi:
    Type: AWS::AppSync::Api
    Condition: EventsEnabled
    Properties:
      Name: !Sub '${AppName}-${Environment}-events'
      EventConfig:
        AuthProviders:
          - AuthType: AMAZON_COGNITO_USER_POOLS
            CognitoConfig:
              AwsRegion: !Ref AWS::Region
              UserPoolId: !Ref UserPool
              AppIdClientRegex: !Sub '^${UserPoolClient}$'
        ConnectionAuthModes:
          - AuthType: AMAZON_COGNITO_USER_POOLS
        DefaultPublishAuthModes:
          - AuthType: AMAZON_COGNITO_USER_POOLS
        DefaultSubscribeAuthModes:
          - AuthType: AMAZON_COGNITO_USER_POOLS
      Tags:
        - Key: app
          Value: !Ref AppName
        - Key: environment
          Value: !Ref Environment

  # Each user's channel is /users/<sub>. The handlers refuse any other channel, so a user can neither listen to nor
  # write to another user's.
  EventsUsersNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Condition: EventsEnabled
    Properties:
      ApiId: !GetAtt EventsApi.ApiId
      Name: users
      CodeHandlers: |
        import { util } from '@aws-appsync/utils';

        function ownChannel(ctx) {
          return ctx.identity && ctx.identity.sub && ctx.info.channel.path === `/users/${ctx.identity.sub}`;
        }

        export function onSubscribe(ctx) {
          if (!ownChannel(ctx)) {
            util.unauthorized();
          }
        }

        export function onPublish(ctx) {
          if (!ownChannel(ctx)) {
            util.unauthorized();
          }
          return ctx.events;
        }
      Tags:
        - Key: app
          Value: !Ref AppName
        - Key: environment
          Value: !Ref Environment

# Every output is exported as <stack name>-<output>, for the app's own stack (cloudformation/app.yaml in the app) to
# import. An exported value cannot change while another stack imports it.
Outputs:
  Region:
    Description: Region the stack is deployed in.
    Value: !Ref AWS::Region
    Export:
      Name: !Sub '${AWS::StackName}-Region'
  PortalUrl:
    Description: URL of the portal.
    Value: !If [UseCustomDomain, !Sub 'https://${CustomDomainName}', !Sub 'https://${PortalDistribution.DomainName}']
    Export:
      Name: !Sub '${AWS::StackName}-PortalUrl'
  PortalBucketName:
    Description: Bucket the published portal is uploaded to.
    Value: !Ref PortalBucket
    Export:
      Name: !Sub '${AWS::StackName}-PortalBucketName'
  DistributionId:
    Description: CloudFront distribution id (for cache invalidation).
    Value: !Ref PortalDistribution
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'
  DistributionDomainName:
    Description: CloudFront domain name (point your custom domain's DNS here).
    Value: !GetAtt PortalDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-DistributionDomainName'
  DataBucketName:
    Description: Per-user data bucket.
    Value: !Ref DataBucket
    Export:
      Name: !Sub '${AWS::StackName}-DataBucketName'
  UserPoolId:
    Description: Cognito user pool id.
    Value: !Ref UserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'
  UserPoolClientId:
    Description: Cognito user pool app client id.
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolClientId'
  IdentityPoolId:
    Description: Cognito identity pool id.
    Value: !Ref IdentityPool
    Export:
      Name: !Sub '${AWS::StackName}-IdentityPoolId'
  AuthenticatedRoleArn:
    Description: IAM role assumed by signed-in users.
    Value: !GetAtt AuthenticatedRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AuthenticatedRoleArn'
  AuditLogBucketName:
    Condition: LogDataAccess
    Description: Bucket the data bucket's access log is written to.
    Value: !Ref AuditLogBucket
    Export:
      Name: !Sub '${AWS::StackName}-AuditLogBucketName'
  EventsHttpEndpoint:
    Condition: EventsEnabled
    Description: Host of the user events API, which events are published to (Events:HttpEndpoint).
    Value: !GetAtt EventsApi.Dns.Http
    Export:
      Name: !Sub '${AWS::StackName}-EventsHttpEndpoint'
  EventsRealtimeEndpoint:
    Condition: EventsEnabled
    Description: Real-time host of the user events API, which devices connect to (Events:RealtimeEndpoint).
    Value: !GetAtt EventsApi.Dns.Realtime
    Export:
      Name: !Sub '${AWS::StackName}-EventsRealtimeEndpoint'
